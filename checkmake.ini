; The root Makefile is a thin container-dispatch wrapper: it forwards every
; goal to `just` via a catch-all rule, so it has no literal all/clean/test
; targets and its recipe bodies are one-line `just`/`podman run` dispatches.
; These rules assume a traditional, self-contained Makefile and do not apply.
[minphony]
disabled=true

[maxbodylength]
disabled=true

[phonydeclared]
disabled=true

; nuttx-shell's target-specific `BUILD_DIR = ...` line plus its `## ` doc
; comment line are one target declared twice by design (checkmake has no
; per-target suppression, and Make does not allow folding the two into one
; line without breaking the variable assignment).
[uniquetargets]
disabled=true
